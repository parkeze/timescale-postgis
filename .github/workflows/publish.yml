# Build and publish to GHCR.
#
# Public on purpose: the point of this image is that other people can use it
# without rebuilding it, and a public package needs no pull secret in the
# clusters that consume it.
name: Publish

on:
  push:
    branches: [main]
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # ALPINE_VERSION must be the release whose default `postgresql`
          # package is PG_MAJOR — that pairing is the whole point of this
          # image. The Dockerfile asserts it, so a wrong row fails the build
          # rather than shipping something that breaks at CREATE EXTENSION.
          - pg_major: '17'
            alpine: '3.21'
            timescaledb: '2.25.1'
            latest: true

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        run: |
          T="${IMAGE}:${{ matrix.timescaledb }}-pg${{ matrix.pg_major }},${IMAGE}:pg${{ matrix.pg_major }}"
          if [ "${{ matrix.latest }}" = "true" ]; then
            T="${T},${IMAGE}:latest"
          fi
          echo "tags=${T}" >> $GITHUB_OUTPUT

      # Built for the host arch only and loaded locally, so the smoke test
      # below runs against the real image before anything is published. A
      # multi-arch build cannot be --load'ed, which is why this is separate
      # from the publish step rather than the same build reused.
      - name: Build for test
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: probe:test
          build-args: |
            PG_MAJOR=${{ matrix.pg_major }}
            ALPINE_VERSION=${{ matrix.alpine }}
            TIMESCALEDB_VERSION=${{ matrix.timescaledb }}
          cache-from: type=gha,scope=pg${{ matrix.pg_major }}
          cache-to: type=gha,mode=max,scope=pg${{ matrix.pg_major }}

      - name: Both extensions load, and geometry works
        # The build-time assertion proves PostGIS was compiled for the right
        # major; only actually loading it proves the library resolves. An
        # image that cannot ST_MakePoint does not get published.
        run: |
          docker run -d --name probe -e POSTGRES_PASSWORD=probe probe:test
          for i in $(seq 1 45); do
            docker exec probe pg_isready -U postgres >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec probe psql -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS timescaledb;" \
            -c "CREATE EXTENSION IF NOT EXISTS postgis;"
          docker exec probe psql -U postgres -tAc "SELECT postgis_version();"
          docker exec probe psql -U postgres -tAc \
            "SELECT ST_AsText(ST_MakePoint(1,2));" | grep -q "POINT(1 2)"
          ACTUAL=$(docker exec probe psql -U postgres -tAc \
            "SELECT current_setting('server_version_num');")
          case "$ACTUAL" in
            ${{ matrix.pg_major }}*) ;;
            *) echo "expected PostgreSQL ${{ matrix.pg_major }}, got $ACTUAL"; exit 1 ;;
          esac
          docker rm -f probe

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          # arm64 as well as amd64: people develop on Apple silicon and deploy
          # on x86, and a base image that only exists for one forces everyone
          # downstream to care about the difference.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            PG_MAJOR=${{ matrix.pg_major }}
            ALPINE_VERSION=${{ matrix.alpine }}
            TIMESCALEDB_VERSION=${{ matrix.timescaledb }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=pg${{ matrix.pg_major }}
          cache-to: type=gha,mode=max,scope=pg${{ matrix.pg_major }}
